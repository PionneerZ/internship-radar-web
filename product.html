<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.6}button,input,select{font:inherit;color:inherit}button,a{touch-action:manipulation}a{color:var(--accent)}button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 13px}button:hover{border-color:var(--accent)}button:disabled{opacity:.6;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.skip{position:absolute;left:12px;top:-90px;background:var(--surface);padding:12px;z-index:5}.skip:focus{top:10px}.shell{max-width:1740px;margin:auto;padding:25px 28px 40px}header{display:flex;justify-content:space-between;gap:24px;align-items:center}h1{font-size:25px;letter-spacing:-.5px;margin:0}h2{font-size:18px;margin:0 0 10px}h3{font-size:17px;margin:0}.subtitle,.muted{color:var(--muted)}.subtitle{margin:3px 0 0;font-size:13px}.header-actions{text-align:right;flex-shrink:0}.runtime{font-size:12px;color:var(--muted);margin-top:4px}.dot{display:inline-block;width:7px;height:7px;background:var(--accent);border-radius:100%;margin-right:5px}.statusline{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px 16px;display:flex;gap:25px;flex-wrap:wrap;font-size:13px}.stat strong{font-size:18px;font-variant-numeric:tabular-nums;margin-right:4px}.notice{font-size:13px;color:var(--warn);margin:10px 0 16px}.nav{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:20px}.nav button{border:0;border-radius:0;background:none;color:var(--muted);padding:11px 18px;border-bottom:3px solid transparent}.nav button[aria-selected=true]{color:var(--text);font-weight:650;border-bottom-color:var(--accent)}.workarea{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px}.filters{display:flex;flex-direction:column;gap:16px}.filter-box{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:15px}.filters label{display:block;font-size:12px;color:var(--muted);margin:14px 0 5px}.filters label:first-child{margin-top:0}input,select{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:9px}input::placeholder{color:var(--muted)}.category{width:100%;display:flex;justify-content:space-between;margin:4px 0;border:0;background:none;padding:8px 9px;text-align:left}.category[aria-pressed=true]{background:var(--soft);color:var(--accent);font-weight:650}.count{font-variant-numeric:tabular-nums}.small{font-size:12px;color:var(--muted)}.clear{width:100%;margin-top:14px;font-size:13px}.results-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;gap:12px}.results-header select{width:auto;padding:5px 10px}.cards{display:flex;flex-direction:column;gap:12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:19px 21px;box-shadow:var(--shadow)}.card-top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.company{color:var(--accent);font-size:12px;font-weight:650;letter-spacing:.3px;margin-bottom:3px}.badge{display:inline-block;border-radius:4px;background:var(--soft);color:var(--accent);font-size:11px;padding:3px 7px;white-space:nowrap}.badge.warn{background:var(--warnbg);color:var(--warn)}.facts{display:flex;flex-wrap:wrap;gap:7px 22px;margin:14px 0 9px;font-size:13px}.facts span{color:var(--muted)}.facts b{font-weight:500;color:var(--text)}.summary{font-size:14px;max-width:1000px;margin:10px 0 13px}.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:15px;border-top:1px solid var(--line);padding-top:12px}.source{font-size:12px;color:var(--muted)}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.actions button{font-size:12px;padding:5px 10px}.actions a{font-size:12px}.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}details{margin-top:12px;font-size:13px}summary{cursor:pointer;color:var(--accent);width:fit-content}.detailbody{border-top:1px solid var(--line);margin-top:12px;padding-top:14px}.detailbody ul{padding-left:20px}.original{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;background:var(--bg);padding:15px;border-radius:6px;max-height:410px;overflow:auto}.mail{font-family:Consolas,monospace;overflow-wrap:anywhere}.empty{padding:60px 20px;text-align:center;border:1px dashed var(--line);border-radius:9px;background:var(--surface)}.tablewrap{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:12px;font-weight:550}td:last-child{white-space:normal;min-width:230px}.source-tools{display:flex;gap:12px;margin-bottom:15px}.source-tools input{max-width:400px}.source-tools select{width:auto}.pending-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pending-item{border:1px solid var(--line);background:var(--surface);padding:14px 16px;border-radius:8px}.pending-item a{font-size:14px}.pending-item p{margin:6px 0 0;font-size:12px;color:var(--muted)}footer{font-size:12px;color:var(--muted);margin-top:26px}.error{padding:14px;border:1px solid var(--warn);border-radius:7px;color:var(--warn);margin:10px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 18px;background:var(--text);color:var(--surface);border-radius:8px;z-index:10} [hidden]{display:none!important}

</style><link rel="stylesheet" href="./reading-queue.css"><script src="./reading-queue.js"></script><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="./publication.css"><script src="./publication.js"></script></head><body><a class="skip" href="#main">跳到岗位列表</a><div class="shell">
<header><div><h1>实习雷达 <span class="muted" style="font-weight:400">/ 产品方向</span></h1><p class="subtitle" id="scope">已授权招聘来源 · 近一周</p></div><div class="header-actions"><a href="./">金融投研看板</a><button id="refresh" hidden disabled>后台更新</button><a id="mobilelink" hidden target="_blank" rel="noopener noreferrer">手机入口</a><div class="runtime" id="runtime"><span class="dot"></span>正在连接本地读取器</div></div></header><aside class="publication-bar" id="publication-status" role="status">正在读取保存时间…</aside>
<div class="statusline" id="stats" aria-label="扫描范围"></div><p class="notice" id="notice"></p>
<nav class="nav" aria-label="看板视图" role="tablist"><button role="tab" aria-selected="true" data-tab="jobs" id="tab-jobs" aria-controls="jobs">岗位</button><button role="tab" aria-selected="false" data-tab="sources" id="tab-sources" aria-controls="sources">来源覆盖</button><button role="tab" aria-selected="false" data-tab="pending" id="tab-pending" aria-controls="pending">未读速览</button></nav>
<main id="main" tabindex="-1"><div id="loaderror" class="error" hidden></div><section id="jobs" role="tabpanel" aria-labelledby="tab-jobs"><div class="workarea"><aside class="filters" aria-label="筛选岗位"><div class="filter-box"><div class="small" style="padding:0 9px 6px">信息状态</div><button class="category" data-category="verified" aria-pressed="true"><span>产品岗位</span><span class="count" id="n-verified">0</span></button><button class="category" data-category="lead" aria-pressed="false"><span>待补充线索</span><span class="count" id="n-lead">0</span></button><button class="category" data-category="adjacent" aria-pressed="false"><span>相关机会</span><span class="count" id="n-adjacent">0</span></button><button class="category" data-category="saved" aria-pressed="false"><span>我的收藏</span><span class="count" id="n-saved">0</span></button></div><div class="filter-box"><label for="query">公司 / 岗位 / 技能</label><input id="query" type="search" placeholder="如：快手、AI、SQL"><label for="city">城市</label><select id="city"><option value="">全部城市</option><option>北京</option><option>上海</option><option>地点未注明</option></select><label for="direction">方向</label><select id="direction"><option value="">全部产品方向</option><option>AI / 技术产品</option><option>策略产品</option><option>增长产品</option><option>数据产品</option><option>产品经理</option></select><button class="clear" id="clear">清空筛选</button></div><p class="small filter-note">每条都保留来源、原文和缺失字段。条目数代表招聘信息，原文未写 HC 人数时不作推测。</p></aside><div><div class="results-header"><span id="resultcount" role="status" aria-live="polite">正在读取…</span><label>排序 <select id="sort"><option value="new">最新发布</option><option value="company">按公司</option></select></label></div><div id="cards" class="cards"></div></div></div></section>
<section id="sources" role="tabpanel" aria-labelledby="tab-sources" hidden><h2>本机记录覆盖</h2><p class="muted" style="font-size:13px">仅展示已识别的招聘群和求职公众号，扫描本机近一周记录。缺失原图或未同步历史仍可能包含岗位。</p><div class="source-tools"><label for="sourcequery" class="small" style="align-self:center">查找来源</label><input id="sourcequery" type="search" placeholder="输入群或公众号名称"><label for="sourcekind" class="small" style="align-self:center">类型</label><select id="sourcekind"><option value="group">微信群</option><option value="followed_account">已关注公众号</option></select></div><div class="tablewrap" role="region" aria-label="来源覆盖表，可横向滚动" tabindex="0"><table><thead><tr><th>群 / 公众号</th><th>一周消息</th><th>图片待核对</th><th>覆盖状态</th></tr></thead><tbody id="sourcebody"></tbody></table></div><p class="small" id="sourcecount" role="status"></p></section>
<section id="pending" role="tabpanel" aria-labelledby="tab-pending" hidden><div id="reading-panel"></div></section></main>
<footer id="footer">所有数据保存在本机。看板仅监听 127.0.0.1。</footer></div><div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';let DATA=null,category='verified',currentTab='jobs';let saved=new Set();try{saved=new Set(JSON.parse(localStorage.getItem('internship-saved')||'[]'))}catch{}const $=id=>document.getElementById(id);const h=(tag,cls,txt)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(txt!=null)x.textContent=txt;return x};const when=s=>s?s.slice(5,16).replace('T',' '):'未注明';const missing=s=>s||'未注明';let toastTimer;function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2300)}
function counts(){for(const c of ['verified','lead','adjacent'])$('n-'+c).textContent=DATA.jobs.filter(j=>j.category===c).length;$('n-saved').textContent=DATA.jobs.filter(j=>saved.has(j.id)).length}
function choose(c){category=c;document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.category===c));renderJobs()}
function fact(parent,label,value){const n=h('span');n.append(document.createTextNode(label+' '),h('b','',missing(value)));parent.append(n)}
function renderJobs(){if(!DATA)return;counts();const query=$('query').value.trim().toLowerCase();let list=DATA.jobs.filter(j=>(category==='saved'?saved.has(j.id):j.category===category)&&(!$('city').value||(j.cities||String(j.city||'').split(' / ')).includes($('city').value)||(!j.city&&$('city').value==='地点未注明'))&&(!$('direction').value||j.direction===$('direction').value)&&(!query||[j.company,j.title,j.summary,...j.requirements].join(' ').toLowerCase().includes(query)));if($('sort').value==='company')list.sort((a,b)=>a.company.localeCompare(b.company,'zh-CN'));$('resultcount').textContent=`${list.length} 条招聘信息 · ${category==='lead'?'公司或投递字段待补充，详见原文':'原文未标注的字段显示“未注明”'}`;$('cards').replaceChildren();if(!list.length){const e=h('div','empty');e.append(h('h3','','没有匹配的岗位'),h('p','muted','试试清空筛选，或切换信息状态。'));$('cards').append(e);return}for(const j of list){const card=h('article','card');const top=h('div','card-top'),title=h('div');title.append(h('div','company',j.company),h('h3','',j.title));top.append(title,h('span','badge'+(j.category==='lead'?' warn':''),j.category==='lead'?'信息待补充':j.category==='adjacent'?'智能硬件相关':j.source_kind==='第三方平台/转发'?'已读第三方原帖':'已核对原帖'));card.append(top);const facts=h('div','facts');fact(facts,'地点',j.city);fact(facts,'出勤',j.days);fact(facts,'时长',j.months);fact(facts,'薪资',j.salary);card.append(facts,h('p','summary',j.summary));const bottom=h('div','card-bottom');bottom.append(h('div','source',`${when(j.posted_at)} · ${j.source_name}${j.additional_sources?.length?' · 另 '+j.additional_sources.length+' 处转载':''}${j.sender?' · '+j.sender:''}`));const acts=h('div','actions');if(j.application_url){const apply=h('a','','打开投递页面');apply.href=j.application_url;apply.target='_blank';apply.rel='noopener noreferrer';acts.append(apply)}if(j.email){const copy=h('button','primary','复制投递邮箱');copy.setAttribute('aria-label','复制 '+j.company+' '+j.title+' 的投递邮箱');copy.onclick=async()=>{try{await navigator.clipboard.writeText(j.email);toast('已复制：'+j.email)}catch{toast('复制失败，可在详情中选取邮箱')}};acts.append(copy)}else if(!j.application_url){acts.append(h('span','small','投递方式待核对'))}const save=h('button','',saved.has(j.id)?'已收藏':'收藏');save.setAttribute('aria-pressed',saved.has(j.id));save.onclick=()=>{saved.has(j.id)?saved.delete(j.id):saved.add(j.id);localStorage.setItem('internship-saved',JSON.stringify([...saved]));renderJobs()};acts.append(save);bottom.append(acts);card.append(bottom);const det=h('details');det.append(h('summary','','查看要求与原文'));const body=h('div','detailbody');if(j.requirements.length){const ul=h('ul');j.requirements.forEach(r=>ul.append(h('li','',r)));body.append(ul)}if(j.email)body.append(h('p','mail','投递邮箱：'+j.email));if(j.application_note)body.append(h('p','',j.application_note));body.append(h('p','small','HC 人数：未注明 · 截止日：未注明 · '+j.review));if(j.source_url){const a=h('a','','打开来源原文');a.href=j.source_url;a.target='_blank';a.rel='noopener noreferrer';body.append(a)}if(j.additional_sources?.length){const list=h('ul');for(const r of j.additional_sources){const item=h('li','small');item.append(document.createTextNode([r.name,r.time&&when(r.time)].filter(Boolean).join(' · ')));if(r.url){const a=h('a','','打开转载');a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';item.append(' · ',a)}list.append(item)}body.append(h('p','small','转载出处'),list)}const original=h('pre','original',j.original);original.tabIndex=0;original.setAttribute('aria-label','消息原文，可滚动');body.append(original,h('p','small','原帖索引：'+j.message_id));det.append(body);card.append(det);$('cards').append(card)}}
function renderSources(){if(!DATA)return;const list=($('sourcekind').value==='group'?DATA.groups:DATA.accounts).filter(s=>s.name.toLowerCase().includes($('sourcequery').value.trim().toLowerCase()));$('sourcebody').replaceChildren();for(const s of list){const tr=h('tr');[s.name,s.message_count,s.image_pending,s.status].forEach(t=>tr.append(h('td','',String(t))));$('sourcebody').append(tr)}$('sourcecount').textContent=`显示 ${list.length} 个来源 · 本机覆盖状态截至 ${when(DATA.collected_at)}`}
function renderPending(){if(DATA)ReadingQueue.mount($('reading-panel'),DATA.reading_queue,DATA.image_issues||[])}
function render(){const c=DATA.coverage;$('scope').textContent=`${DATA.window_start.slice(0,10)} 至 ${DATA.window_end.slice(0,10)} · 招聘群与已关注求职公众号`;$('stats').replaceChildren();for(const [n,label] of [[c.groups,'个招聘群'],[c.followed_accounts,'个求职公众号'],[c.messages,'条招聘范围消息']]){const s=h('span','stat');s.append(h('strong','',String(n)),document.createTextNode(label));$('stats').append(s)}$('stats').append(h('span','small','读取截至 '+when(DATA.collected_at)));$('notice').textContent=`仅展示招聘范围的信息。图片完整识别 ${c.images_read}/${c.images_total}；全部来源文章已读全 ${DATA.reading_queue?.counts.complete??c.articles_scan_read}/${DATA.reading_queue?.total??c.articles_scan_total}；未读 ${DATA.reading_queue?.remaining??c.articles_scan_pending} · 异地跳过 ${c.articles_location_skipped??0} 篇。${c.images_pending||c.articles_blocked||c.source_sync_gaps?'未读片段与补读进度可在“未读速览”查看，不能确认已收齐。':'本机范围处理完成；云端未同步历史仍无法确认。'}`;$('footer').textContent='后台每 5 分钟检查新消息，正文、图片独立补读并抽取去重；登录 Windows 后自动启动及恢复进程。电脑需开机联网且微信有本地记录。共享页仅展示招聘信息，电脑开机联网时自动更新。';renderJobs();renderSources();renderPending()}
async function load(){try{const r=await fetch('./data/data.json');if(!r.ok)throw Error('读取失败');DATA=await r.json();$('loaderror').hidden=true;render()}catch(e){$('loaderror').textContent='共享快照暂时未能加载，当前结果会保留；请稍后重试。';$('loaderror').hidden=false}}
async function status(){try{const r=await fetch('./data/status.json');const s=await r.json();if(s.snapshot_at){RadarPublication.update(s);return;}$('runtime').textContent=s.status==='running'?'后台正在更新，不占用桌面':s.status==='failed'?'更新失败，已保留上次结果':'每 5 分钟检查新消息 · 不占用桌面';$('refresh').disabled=s.status==='running';if(s.status==='failed'){$('loaderror').textContent='本次后台读取失败（'+s.last_error+'）。仍显示上次成功读取的结果。';$('loaderror').hidden=false}}catch{$('runtime').textContent='后台连接中断 · 保留已有结果'}}
document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>choose(b.dataset.category));['query','city','direction','sort'].forEach(id=>$(id).addEventListener('input',renderJobs));$('clear').onclick=()=>{$('query').value='';$('city').value='';$('direction').value='';renderJobs()};['sourcequery','sourcekind'].forEach(id=>$(id).addEventListener('input',renderSources));const tabs=[...document.querySelectorAll('[data-tab]')];function selectTab(b){currentTab=b.dataset.tab;tabs.forEach(t=>{t.setAttribute('aria-selected',t===b);t.tabIndex=t===b?0:-1;$(t.dataset.tab).hidden=t!==b})}tabs.forEach((b,i)=>{b.tabIndex=i===0?0:-1;b.onclick=()=>selectTab(b);b.onkeydown=e=>{let n=e.key==='ArrowRight'?(i+1)%tabs.length:e.key==='ArrowLeft'?(i+tabs.length-1)%tabs.length:e.key==='Home'?0:e.key==='End'?tabs.length-1:null;if(n!==null){e.preventDefault();selectTab(tabs[n]);tabs[n].focus()}}});$('refresh').onclick=async()=>{try{$('refresh').disabled=true;await fetch('/api/refresh',{method:'POST',headers:{'X-Workbench':'local'}});toast('已开始后台更新');setTimeout(async()=>{await load();await status()},5000)}catch{toast('更新未启动，请稍后重试')}finally{$('refresh').disabled=false}};fetch('./data/mobile.json').then(r=>r.ok?r.json():null).then(s=>{if(s&&s.available){$('mobilelink').href=s.url;$('mobilelink').hidden=false}}).catch(()=>{});if(new URLSearchParams(location.search).get('tab')==='pending')selectTab($('tab-pending'));load();status();setInterval(()=>{if(!document.hidden){load();status()}},60000);
</script></body></html>
